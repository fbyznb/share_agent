server:
  port: 8081

spring:
  application:
    name: spring-boot-app

  jpa:
    open-in-view: false

  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    username: ${ES_USERNAME:}
    password: ${ES_PASSWORD:}
    connection-timeout: 10s
    socket-timeout: 30s

  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}

      chat:
        options:
          model: qwen-plus

      embedding:
        options:
          model: text-embedding-v3
          dimensions: 1024

    vectorstore:
      elasticsearch:
        initialize-schema: true
        index-name: share-agent-vectors-v1
        dimensions: 1024
        similarity: cosine

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/share_agent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:abc123}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1800000}
      connection-test-query: SELECT 1
      pool-name: HikariCP-MySQL

  data:
    redis:
      host: ${REDIS_HOST:192.168.6.100}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:abc123}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:30000}

      lettuce:
        pool:
          max-active: ${REDIS_MAX_ACTIVE:20}
          max-idle: ${REDIS_MAX_IDLE:10}
          min-idle: ${REDIS_MIN_IDLE:5}
          max-wait: ${REDIS_MAX_WAIT:-1}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

redisson:
  single-server-config:
    address: redis://${REDIS_HOST:192.168.6.100}:${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:abc123}
    database: ${REDIS_DATABASE:0}
    connection-pool-size: ${REDIS_MAX_ACTIVE:20}
    idle-connection-timeout: ${REDIS_TIMEOUT:30000}

rocketmq:
  name-server: ${ROCKETMQ_NAMESRV_ADDR:192.168.6.100:9876}

  producer:
    group: ${ROCKETMQ_PRODUCER_GROUP:spring-boot-producer-group}
    send-message-timeout: ${ROCKETMQ_SEND_TIMEOUT:3000}
    retry-times-when-send-failed: ${ROCKETMQ_RETRY_TIMES:2}
    retry-times-when-send-async-failed: ${ROCKETMQ_RETRY_ASYNC_TIMES:2}
    max-message-size: ${ROCKETMQ_MAX_MESSAGE_SIZE:4194304}
    compress-message-body-threshold: ${ROCKETMQ_COMPRESS_THRESHOLD:4096}

  consumer:
    group: ${ROCKETMQ_CONSUMER_GROUP:spring-boot-consumer-group}
    consume-thread-min: ${ROCKETMQ_CONSUME_THREAD_MIN:20}
    consume-thread-max: ${ROCKETMQ_CONSUME_THREAD_MAX:64}
    message-model: ${ROCKETMQ_MESSAGE_MODEL:CLUSTERING}
    consume-from-where: ${ROCKETMQ_CONSUME_FROM:CONSUME_FROM_LAST_OFFSET}
    consume-timeout: ${ROCKETMQ_CONSUME_TIMEOUT:15}

logging:
  level:
    root: INFO
    post: DEBUG
    org.springframework.boot.context.config: INFO

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
